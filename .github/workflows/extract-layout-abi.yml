name: Extract layout ABI

on:
  workflow_call:
    inputs:
      bambu_ref:
        required: true
        type: string

permissions:
  contents: read

env:
  BAMBU_SOURCE_DIR: ${{ github.workspace }}/.work/BambuStudio
  BAMBU_REQUIRE_GIT_LFS: "0"
  BAMBU_SKIP_SUBMODULES: "1"

jobs:
  extract:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - id: upstream
        env:
          BAMBU_REF: ${{ inputs.bambu_ref }}
        run: ./scripts/checkout-bambustudio.sh "$BAMBU_REF" "$BAMBU_SOURCE_DIR"
      - run: ./scripts/verify-upstream-build-contract.sh "$BAMBU_SOURCE_DIR"
      - name: Resolve version requirements
        run: |
          python3 scripts/resolve-version-requirements.py \
            --root abi-layouts --version '${{ steps.upstream.outputs.version }}'
          python3 scripts/materialize-abi-requirements.py \
            --requirements 'abi-layouts/${{ steps.upstream.outputs.version }}/requirements.json' \
            --target macos-arm64 --output-dir "$GITHUB_WORKSPACE/.work/requirements"
      - id: cache-key
        shell: bash
        env:
          DEPS_TREE: ${{ steps.upstream.outputs.deps_tree }}
        run: |
          source ./scripts/lib/common.sh
          image_version=$(sanitize_cache_component "${ImageVersion:-unknown}")
          echo "key=bambustudio-deps-macos-15-arm64-${RUNNER_ARCH}-${image_version}-cmake-3.31.0-${DEPS_TREE}" >>"$GITHUB_OUTPUT"
      - id: deps-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ env.BAMBU_SOURCE_DIR }}/deps/build
          key: ${{ steps.cache-key.outputs.key }}
      - name: Free runner disk space
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          df -h
          sudo find /Applications -maxdepth 1 -type d -name "Xcode_*.app" ! -name "Xcode_15.4.app" -exec rm -rf {} +
          sudo rm -rf "$HOME/Library/Developer/CoreSimulator/Caches"/* || true
          df -h
      - name: Set up dependency toolchain
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: ./scripts/setup-macos-toolchain.sh deps
      - name: Build dependency headers
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-macos-deps.sh "$BAMBU_SOURCE_DIR"
      - name: Extract all layout requirements in one compiler invocation
        env:
          OUTPUT: ${{ github.workspace }}/artifacts/layout-abi.json
        run: |
          dependency_prefix="$BAMBU_SOURCE_DIR/deps/build/arm64/BambuStudio_deps/usr/local"
          mkdir -p "$(dirname "$OUTPUT")"
          ./scripts/extract-macos-abi.sh "$BAMBU_SOURCE_DIR" "$dependency_prefix" "$OUTPUT" "$GITHUB_WORKSPACE/.work/requirements"
          python3 - "$OUTPUT" <<'PY'
          import json, os, sys
          path=sys.argv[1]; d=json.load(open(path))
          d["upstream"]={"repository":"https://github.com/bambulab/BambuStudio.git","commit":"${{ steps.upstream.outputs.commit }}","deps_tree":"${{ steps.upstream.outputs.deps_tree }}","version":"${{ steps.upstream.outputs.version }}"}
          d["runner"]={"image":os.getenv("ImageOS",""),"image_version":os.getenv("ImageVersion",""),"architecture":os.getenv("RUNNER_ARCH",""),"dependency_cache_key":"${{ steps.cache-key.outputs.key }}"}
          json.dump(d,open(path,"w"),indent=2,sort_keys=True);open(path,"a").write("\n")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: layout-abi-macos-arm64
          path: ${{ github.workspace }}/artifacts/layout-abi.json
          if-no-files-found: error
          retention-days: 30
