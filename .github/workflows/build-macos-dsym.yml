name: Build macOS dSYM

on:
  workflow_dispatch:
    inputs:
      bambu_ref:
        description: Upstream BambuStudio tag, branch, or full commit
        required: true
        type: string
        default: v02.08.02.60
      rebuild_dependencies:
        description: Ignore a matching dependency cache
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-dsym-${{ inputs.bambu_ref }}
  cancel-in-progress: false

env:
  BAMBU_SOURCE_DIR: ${{ github.workspace }}/.work/BambuStudio
  BAMBU_REQUIRE_GIT_LFS: "1"

jobs:
  resolve:
    name: Resolve upstream revision
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.upstream.outputs.commit }}
      short_commit: ${{ steps.upstream.outputs.short_commit }}
      deps_tree: ${{ steps.upstream.outputs.deps_tree }}
      version: ${{ steps.upstream.outputs.version }}
    steps:
      - name: Check out this project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check out and resolve BambuStudio
        id: upstream
        env:
          BAMBU_REF: ${{ inputs.bambu_ref }}
          BAMBU_REQUIRE_GIT_LFS: "0"
          BAMBU_SKIP_SUBMODULES: "1"
        run: ./scripts/checkout-bambustudio.sh "$BAMBU_REF" "$BAMBU_SOURCE_DIR"

      - name: Verify supported upstream macOS build contract
        run: ./scripts/verify-upstream-build-contract.sh "$BAMBU_SOURCE_DIR"

      - name: Summarize resolved source
        env:
          COMMIT: ${{ steps.upstream.outputs.commit }}
          DEPS_TREE: ${{ steps.upstream.outputs.deps_tree }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          {
            echo "## Resolved BambuStudio source"
            echo
            echo "- Requested ref: \`${{ inputs.bambu_ref }}\`"
            echo "- Commit: \`$COMMIT\`"
            echo "- Dependency tree: \`$DEPS_TREE\`"
            echo "- Upstream version: \`$VERSION\`"
          } >>"$GITHUB_STEP_SUMMARY"

  dependencies:
    name: Build macOS dependencies
    needs: resolve
    runs-on: macos-15
    timeout-minutes: 360
    outputs:
      cache_key: ${{ steps.cache-key.outputs.key }}
    steps:
      - name: Check out this project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check out exact BambuStudio commit
        env:
          BAMBU_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: ./scripts/checkout-bambustudio.sh "$BAMBU_COMMIT" "$BAMBU_SOURCE_DIR"

      - name: Create dependency cache key
        id: cache-key
        shell: bash
        env:
          DEPS_TREE: ${{ needs.resolve.outputs.deps_tree }}
          REBUILD_DEPENDENCIES: ${{ inputs.rebuild_dependencies }}
        run: |
          source ./scripts/lib/common.sh
          image_version=$(sanitize_cache_component "${ImageVersion:-unknown}")
          key="bambustudio-deps-macos-15-${RUNNER_ARCH}-${image_version}-cmake-3.31.0-${DEPS_TREE}"
          if [[ "$REBUILD_DEPENDENCIES" == "true" ]]; then
            key="${key}-rebuild-${GITHUB_RUN_ID}"
          fi
          echo "key=$key" >>"$GITHUB_OUTPUT"

      - name: Restore dependency cache
        id: deps-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.BAMBU_SOURCE_DIR }}/deps/build
          key: ${{ steps.cache-key.outputs.key }}

      - name: Free runner disk space
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          df -h
          sudo find /Applications -maxdepth 1 -type d -name "Xcode_*.app" ! -name "Xcode_15.4.app" -exec rm -rf {} +
          sudo rm -rf "$HOME/Library/Developer/CoreSimulator/Caches"/* || true
          df -h

      - name: Set up upstream dependency toolchain
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: ./scripts/setup-macos-toolchain.sh deps

      - name: Build upstream dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-macos-deps.sh "$BAMBU_SOURCE_DIR"

      - name: Save dependency cache
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.BAMBU_SOURCE_DIR }}/deps/build
          key: ${{ steps.cache-key.outputs.key }}

  dsym:
    name: Build BambuStudio and create dSYM
    needs: [resolve, dependencies]
    runs-on: macos-15
    timeout-minutes: 360
    env:
      BAMBU_REF: ${{ inputs.bambu_ref }}
      BAMBU_COMMIT: ${{ needs.resolve.outputs.commit }}
      BAMBU_DEPS_TREE: ${{ needs.resolve.outputs.deps_tree }}
      BAMBU_VERSION: ${{ needs.resolve.outputs.version }}
      OUTPUT_DIR: ${{ github.workspace }}/artifacts/macos-dsym
    steps:
      - name: Check out this project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check out exact BambuStudio commit
        run: ./scripts/checkout-bambustudio.sh "$BAMBU_COMMIT" "$BAMBU_SOURCE_DIR"

      - name: Restore exact dependency cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.BAMBU_SOURCE_DIR }}/deps/build
          key: ${{ needs.dependencies.outputs.cache_key }}
          fail-on-cache-miss: true

      - name: Set up upstream application toolchain
        run: ./scripts/setup-macos-toolchain.sh app

      - name: Build Release application with standalone DWARF
        run: ./scripts/build-macos-app.sh "$BAMBU_SOURCE_DIR"

      - name: Create and validate dSYM
        run: ./scripts/collect-macos-dsym.sh "$BAMBU_SOURCE_DIR" "$OUTPUT_DIR"

      - name: Upload dSYM and provenance
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bambustudio-macos-dsym-${{ needs.resolve.outputs.short_commit }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: error
          compression-level: 6
          retention-days: 14

      - name: Summarize artifact
        run: |
          {
            echo "## Rebuilt macOS dSYM"
            echo
            echo "- Upstream version: \`$BAMBU_VERSION\`"
            echo "- Commit: \`$BAMBU_COMMIT\`"
            echo "- Artifact: \`bambustudio-macos-dsym-${{ needs.resolve.outputs.short_commit }}\`"
            echo
            echo "This dSYM matches the rebuilt executable UUIDs recorded in the artifact."
            echo "It is not asserted to match Bambu Lab's released executable UUIDs."
          } >>"$GITHUB_STEP_SUMMARY"
